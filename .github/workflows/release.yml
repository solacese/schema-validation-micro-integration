name: Release
on:
  push:
    tags: ['v*.*.*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify and package committed source
        id: package
        run: |
          ./scripts/package-release.sh
      - name: Validate release tag
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.package.outputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ARTIFACT_STAGE=packaged
            VERSION=${{ steps.package.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.package.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          python3 scripts/release-notes.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Schema Validation Micro-Integration $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
