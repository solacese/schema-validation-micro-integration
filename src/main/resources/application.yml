management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,bindings
  datadog:
    metrics:
      export:
        enabled: false
  dynatrace:
    metrics:
      export:
        enabled: false
  influx:
    metrics:
      export:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  simple:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.solace.schemavalidator: INFO
