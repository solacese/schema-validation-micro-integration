      artifact-type: JSON
      version-strategy:
        type: LATEST_ENABLED
    # ── Acme SHOPFLOOR FromSI ──
    - id: acme-shopfloor-si-pub-files
      topic-pattern: Acme/{site}/{pmno}/SHOPFLOOR/{protocol}/FromSI/PUB_FILES
      schema-group: manufacturing-iot
