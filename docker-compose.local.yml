services:
  schema-validation-micro-integration:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_IMAGE: ${MI_BUILD_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        RUNTIME_IMAGE: ${MI_RUNTIME_IMAGE:-eclipse-temurin:17-jre}
    image: schema-validation-micro-integration:local
    container_name: schema-validation-micro-integration
    init: true
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      PORT: 8088
      SOLACE_INPUT_BROKER: ${SOLACE_INPUT_BROKER:-${URL}}
      SOLACE_INPUT_VPN: ${SOLACE_INPUT_VPN:-${VPN}}
      SOLACE_INPUT_USERNAME: ${SOLACE_INPUT_USERNAME:-${USER}}
      SOLACE_INPUT_PASSWORD: ${SOLACE_INPUT_PASSWORD:-${PWD}}
      SOLACE_OUTPUT_BROKER: ${SOLACE_OUTPUT_BROKER:-${URL}}
      SOLACE_OUTPUT_VPN: ${SOLACE_OUTPUT_VPN:-${VPN}}
      SOLACE_OUTPUT_USERNAME: ${SOLACE_OUTPUT_USERNAME:-${USER}}
      SOLACE_OUTPUT_PASSWORD: ${SOLACE_OUTPUT_PASSWORD:-${PWD}}
      SOLACE_BROKER: ${SOLACE_INPUT_BROKER:-${URL}}
      SOLACE_VPN: ${SOLACE_INPUT_VPN:-${VPN}}
      SCHEMA_REGISTRY_BASE_URL: ${SCHEMA_REGISTRY_BASE_URL:-http://schema-registry-backend:8080/apis/registry/v3}
      SCHEMA_REGISTRY_USERNAME: ${SCHEMA_REGISTRY_USERNAME:-sr-readonly}
      SCHEMA_REGISTRY_PASSWORD: ${SCHEMA_REGISTRY_PASSWORD:-roPassword}
      CONSUMER_CONCURRENCY: ${CONSUMER_CONCURRENCY:-8}
      PARTITION_COUNT: ${PARTITION_COUNT:-0}
      SCHEMA_REGISTRY_REQUEST_TIMEOUT: 1500ms
      REGISTRY_LOOKUP_TTL: 120m
      MAX_REGISTRY_CACHE_ENTRIES: 5000
      MAX_SCHEMA_CACHE_ENTRIES: 5000
      MAX_VALIDATOR_CACHE_ENTRIES: 5000
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom}
    volumes:
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,nodev,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    cpus: 2.0
    mem_limit: 2g
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/healthcheck.jar", "Healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - default
      - registry
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

networks:
  registry:
    name: schema-micro-integration_default
    external: true
